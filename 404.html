<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>404 - Page Not Found</title>
        <style>
            :root {
                --bg-color: #7B00A8;
                --fg-color: #1D008F;
                --bg-gradient: linear-gradient(
                    170deg,
                    var(--bg-color) 0%,
                    #630087 50%,
                    var(--fg-color) 100%
                );
                --sun-bg-color: #F54489;
                --sun-fg-color: #FEF93D;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Helvetica, sans-serif;
                background-color: var(--bg-color);
                background: linear-gradient(135deg, #050817 0%, #7b35c4 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                overflow: hidden;
                position: relative;
            }

            .stars {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 1;
            }

            .star {
                position: absolute;
                width: 2px;
                height: 2px;
                background: white;
                border-radius: 50%;
                animation: twinkle 3s infinite;
            }

            @keyframes twinkle {
                0%, 100% { opacity: 0.3; }
                50% { opacity: 1; }
            }

            .underlay {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: transparent;
                background-size: 5px 5px, 5px 5px;
                background-position: -1px -1px, -1px -1px;
                background-image: linear-gradient(rgba(255, 255, 255, .1) 1px, transparent 1px), 
                                linear-gradient(90deg, rgba(255, 255, 255, .1) 1px, transparent 1px);
                mix-blend-mode: difference;
                z-index: 0;
            }

            .glitch-overlay {
                clip-path: polygon(0 0, 100% 0, 100% 1em, 0 1em);
                animation: glitch 10s linear infinite;
            }

            @keyframes glitch {
                to {
                    clip-path: polygon(0 calc(100% - 0.7rem), 100% calc(100% - 0.7rem), 100% 100%, 0% 100%)
                }
            }

            .container {
                text-align: center;
                z-index: 2;
                padding: 2rem;
                max-width: 600px;
                position: relative;
            }

            .error-code {
                font-size: 8rem;
                font-weight: 900;
                line-height: 1;
                margin-bottom: 1rem;
                text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                animation: float 3s ease-in-out infinite;
                position: relative;
            }

            @keyframes float {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-20px); }
            }

            .glitch-text {
                position: relative;
            }

            .glitch-text::before,
            .glitch-text::after {
                content: '404';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                opacity: 0.8;
            }

            .glitch-text::before {
                animation: glitch1 2s infinite;
                color: var(--sun-bg-color);
                z-index: -1;
            }

            .glitch-text::after {
                animation: glitch2 2s infinite;
                color: var(--sun-fg-color);
                z-index: -2;
            }

            @keyframes glitch1 {
                0%, 100% { transform: translate(0); }
                20% { transform: translate(-3px, 3px); }
                40% { transform: translate(-3px, -3px); }
                60% { transform: translate(3px, 3px); }
                80% { transform: translate(3px, -3px); }
            }

            @keyframes glitch2 {
                0%, 100% { transform: translate(0); }
                20% { transform: translate(3px, -3px); }
                40% { transform: translate(3px, 3px); }
                60% { transform: translate(-3px, -3px); }
                80% { transform: translate(-3px, 3px); }
            }

            h1 {
                font-family: 'Inter', Verdana, sans-serif;
                font-size: 2.5rem;
                margin-bottom: 1rem;
                font-weight: 800;
                letter-spacing: -1.75px;
            }

            p {
                font-size: 1.2rem;
                margin-bottom: 2rem;
                opacity: 0.9;
                line-height: 1.6;
            }

            .btn {
                display: inline-block;
                padding: 1rem 2.5rem;
                background-color: bisque;
                color: black;
                text-decoration: none;
                border-radius: 12px;
                font-family: 'Lora', Verdana, sans-serif;
                font-weight: 600;
                font-size: 1.1rem;
                transition: all 0.3s ease;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                border: none;
                border-style: groove;
            }

            .btn:hover {
                animation: buttons 1s ease-in 200ms;
                animation-fill-mode: forwards;
                transform: translateY(-3px);
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            }

            @keyframes buttons {
                0% { background-color: bisque; color: black; }
                100% { background-color: chocolate; color: bisque; }
            }

            .alien {
                font-size: 4rem;
                margin-bottom: 1rem;
                animation: bounce 2s infinite;
            }

            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-15px); }
            }

            .classy-link:link {
                text-decoration: underline;
                text-decoration-color: black;
                color: rgb(192, 199, 223);
            }

            .classy-link:visited {
                text-decoration: underline;
                text-decoration-color: black;
                color: black;
            }

            .classy-link:hover {
                text-decoration: underline;
                text-decoration-color: black;
                color: rgb(212, 219, 244);
            }

            .classy-link:active {
                text-decoration: underline;
                text-decoration-color: black;
                color: #FEF93D;
            }

            @media (max-width: 768px) {
                .error-code {
                    font-size: 5rem;
                }
                h1 {
                    font-size: 1.8rem;
                }
                p {
                    font-size: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="stars" id="stars"></div>
        <div class="underlay"></div>
        <div class="underlay glitch-overlay"></div>
        
        <div class="container">
            <div class="alien">👽</div>
            <div class="error-code glitch-text">404</div>
            <h1>Houston, We Have a Problem</h1>
            <p>The page you're looking for has drifted into deep space. It might have been moved, deleted, or never existed in this dimension.</p>
            <a href="/" class="btn">Return to Home Base</a>
        </div>

        <script>
            // Generate random stars
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        </script>
    </body>
</html>
